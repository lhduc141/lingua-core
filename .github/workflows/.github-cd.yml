name: CD VPS

on:
  workflow_run:
    workflows: ["CI VPS"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_health_check:
        description: 'Skip health check after deploy'
        required: false
        default: 'false'

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Chỉ deploy khi CI success, hoặc khi trigger manual
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Print deploy info
        run: |
          echo "Triggered by: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Pull latest code
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} bash -s << 'ENDSSH'
          set -e
          cd /root/lingua-core
          git fetch origin main
          git reset --hard origin/main
          echo "Deployed commit: $(git rev-parse --short HEAD) -- $(git log -1 --pretty=format:'%s')"
          ENDSSH

      - name: Sync secrets to VPS .env
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} bash -s << ENDSSH
          set -e
          cd /root/lingua-core

          update_env() {
            local key="\$1"
            local value="\$2"
            if grep -q "^\${key}=" .env 2>/dev/null; then
              sed -i "s|^\${key}=.*|\${key}=\${value}|" .env
            else
              echo "\${key}=\${value}" >> .env
            fi
          }

          update_env "AZURE_SPEECH_KEY" "${{ secrets.AZURE_SPEECH_KEY }}"
          update_env "AZURE_SPEECH_REGION" "${{ secrets.AZURE_SPEECH_REGION }}"
          update_env "GROQ_API_KEY" "${{ secrets.GROQ_API_KEY }}"
          update_env "DATABASE_PASSWORD" "${{ secrets.DATABASE_PASSWORD }}"
          update_env "REDIS_PASSWORD" "${{ secrets.REDIS_PASSWORD }}"
          update_env "JWT_SECRET" "${{ secrets.JWT_SECRET }}"
          update_env "GOOGLE_CLIENT_ID" "${{ secrets.GOOGLE_CLIENT_ID }}"
          update_env "GOOGLE_CLIENT_SECRET" "${{ secrets.GOOGLE_CLIENT_SECRET }}"
          update_env "GOOGLE_CALLBACK_URL" "${{ secrets.GOOGLE_CALLBACK_URL }}"
          update_env "CORS_ORIGIN" "${{ secrets.CORS_ORIGIN }}"

          echo "Secrets synced to .env"
          ENDSSH

      - name: Run Prisma migrations
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} bash -s << 'ENDSSH'
          set -e
          cd /root/lingua-core

          echo "Running Prisma migrations..."
          docker compose -f docker-compose.prod.yml run --rm \
            api-gateway \
            sh -c "npx prisma migrate deploy --schema=./prisma/"

          echo "Migrations complete"
          ENDSSH

      - name: Build and restart app containers
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} bash -s << 'ENDSSH'
          set -e
          cd /root/lingua-core

          echo "Building containers..."
          docker compose -f docker-compose.prod.yml build api-gateway ai-service

          echo "Restarting app containers..."
          docker compose -f docker-compose.prod.yml up -d --no-deps api-gateway ai-service

          echo "Waiting for startup..."
          sleep 15

          echo "Container status:"
          docker compose -f docker-compose.prod.yml ps
          ENDSSH

      - name: Health check
        if: ${{ github.event.inputs.skip_health_check != 'true' }}
        run: |
          sleep 5
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            https://api.lingua-panda.io.vn/health/services || echo "000")
          echo "Health check /health/db: $RESPONSE"
          if [ "$RESPONSE" = "200" ]; then
            echo "Health check PASSED"
          else
            echo "Health check FAILED -- status $RESPONSE"
            exit 1
          fi

      - name: Print logs
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} bash -s << 'ENDSSH'
          echo "=== api-gateway (last 30 lines) ==="
          docker logs linguapanda_api_gateway --tail 30 2>&1
          echo "=== ai-service (last 10 lines) ==="
          docker logs linguapanda_ai_service --tail 10 2>&1
          ENDSSH

      - name: Cleanup old images
        if: success()
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} bash -s << 'ENDSSH'
          docker image prune -f
          echo "Disk usage: $(df -h / | tail -1 | awk '{print $5}')"
          ENDSSH

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deploy failed -- rolling back to previous commit"
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} bash -s << 'ENDSSH'
          set -e
          cd /root/lingua-core
          git reset --hard HEAD~1
          echo "Rolled back to: $(git rev-parse --short HEAD)"
          docker compose -f docker-compose.prod.yml build api-gateway ai-service
          docker compose -f docker-compose.prod.yml up -d --no-deps api-gateway ai-service
          sleep 10
          docker compose -f docker-compose.prod.yml ps
          ENDSSH