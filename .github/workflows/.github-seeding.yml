name: Run Seed

on:
  workflow_dispatch:
    inputs:
      seed_file:
        description: 'Seed file to run'
        required: true
        type: choice
        options:
          - prisma/seeds/content/seed-content-from-json.ts
          - prisma/seeds/placement/seed-placement.ts
          - prisma/seeds/dictionary/seed-dictionary.ts
          - prisma/seeds/practice/seed-practice-from-json.ts
          - prisma/seeds/practice/seeding-writing-task2.ts
          - prisma/seeds/practice/seed-speaking-task2.ts
          - prisma/seeds/listening/seed-listening.ts

jobs:
  seed:
    name: Run Seed on VPS
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Run seed on VPS
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd /root/lingua-core

            echo "Running seed: ${{ github.event.inputs.seed_file }}"

            docker exec linguapanda_api_gateway \
              node_modules/.bin/tsx ${{ github.event.inputs.seed_file }}

            echo "Seed complete: ${{ github.event.inputs.seed_file }}"
          EOF