name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Cho phép manual trigger từ GitHub UI

env:
  # Non-sensitive configs (hardcoded)
  NODE_ENV: production
  TZ: Asia/Ho_Chi_Minh
  HOST: 0.0.0.0
  PAYLOAD_LIMIT: 50mb

  # Service configs
  AI_SERVICE_HOST: ai-service
  AI_SERVICE_PORT: 4001
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_PREFIX: lp
  DATABASE_HOST: postgres

  # JWT configs
  JWT_ALG: HS256
  JWT_KID: lingua-key-prod-1
  JWT_ISS: linguapanda.api
  JWT_AUD: linguapanda.web
  JWT_ACCESS_TTL: 864000
  JWT_REFRESH_TTL: 2592000
  JWT_SERVICE_TTL: 300

  # AI configs
  LLM_MODEL: gemini-2.0-flash-exp

  # Logging
  LOG_LEVEL: info

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Checkout code (for reference)
      - name: Checkout code
        uses: actions/checkout@v4

      # STEP 2: Setup SSH connection
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # STEP 3: Create .env file from secrets
      - name: Create .env file on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key $VPS_USER@$VPS_HOST << 'ENDSSH'
            cat > /var/www/lingua-core/.env << 'ENVFILE'
          # ===================================
          # LINGUAPANDA - PRODUCTION ENVIRONMENT
          # ===================================
          # Auto-generated by GitHub Actions
          # DO NOT EDIT MANUALLY
          
          # Application
          NODE_ENV=${{ env.NODE_ENV }}
          TZ=${{ env.TZ }}
          HOST=${{ env.HOST }}
          PAYLOAD_LIMIT=${{ env.PAYLOAD_LIMIT }}
          
          # Database
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DATABASE_HOST=${{ env.DATABASE_HOST }}
          
          # Redis
          REDIS_HOST=${{ env.REDIS_HOST }}
          REDIS_PORT=${{ env.REDIS_PORT }}
          REDIS_DB=${{ env.REDIS_DB }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_PREFIX=${{ env.REDIS_PREFIX }}
          
          # AI Service
          AI_SERVICE_HOST=${{ env.AI_SERVICE_HOST }}
          AI_SERVICE_PORT=${{ env.AI_SERVICE_PORT }}
          
          # Google OAuth
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }}
          
          # JWT
          JWT_ALG=${{ env.JWT_ALG }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_KID=${{ env.JWT_KID }}
          JWT_ISS=${{ env.JWT_ISS }}
          JWT_AUD=${{ env.JWT_AUD }}
          JWT_ACCESS_TTL=${{ env.JWT_ACCESS_TTL }}
          JWT_REFRESH_TTL=${{ env.JWT_REFRESH_TTL }}
          JWT_SERVICE_TTL=${{ env.JWT_SERVICE_TTL }}
          
          # AI - LLM
          LLM_MODEL=${{ env.LLM_MODEL }}
          LLM_API_KEY=${{ secrets.LLM_API_KEY }}
          
          # CORS
          CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
          
          # Frontend
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          
          # Logging
          LOG_LEVEL=${{ env.LOG_LEVEL }}
          ENVFILE
          ENDSSH
          
          echo ".env file created successfully on VPS"

      # STEP 4: Pull latest code
      - name: Pull latest code on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key $VPS_USER@$VPS_HOST << 'ENDSSH'
            set -e
            cd /var/www/lingua-core
          
            echo "=== Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main
          
            echo "Code updated to latest commit: $(git rev-parse --short HEAD)"
          ENDSSH

      # STEP 5: Deploy with Docker Compose
      - name: Deploy containers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key $VPS_USER@$VPS_HOST << 'ENDSSH'
            set -e
            cd /var/www/lingua-core
          
            echo "=== Stopping old containers ==="
            docker compose -f docker compose.prod.yml down || true
          
            echo "=== Building new images ==="
            docker compose -f docker compose.prod.yml build --no-cache
          
            echo "=== Starting containers ==="
            docker compose -f docker compose.prod.yml up -d
          
            echo "=== Waiting for containers to be healthy ==="
            sleep 15
          
            echo "=== Container status ==="
            docker compose -f docker compose.prod.yml ps
          
            echo "Deployment completed!"
          ENDSSH

      # STEP 6: Health check
      - name: Health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "Waiting 10 seconds for services to fully start..."
          sleep 10
          
          echo "Checking API Gateway health..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://$VPS_HOST:3000/health || echo "000")
          
          if [ "$RESPONSE" = "200" ]; then
            echo "Health check passed! API is responding."
          else
            echo "Warning: Health check returned status $RESPONSE"
            echo "This might be normal if health endpoint is not yet implemented."
          fi

      # STEP 7: Cleanup old Docker images
      # ==========================================
      - name: Cleanup old images
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key $VPS_USER@$VPS_HOST << 'ENDSSH'
            echo "=== Removing unused Docker images ==="
            docker image prune -f
          
            echo "=== Current disk usage ==="
            df -h | grep -E 'Filesystem|/dev/vda'
          
            echo "Cleanup completed!"
          ENDSSH

      # STEP 8: Summary
      # ==========================================
      - name: Deployment Summary
        if: success()
        run: |
          echo "DEPLOYMENT SUCCESSFUL"
          echo "Commit: ${{ github.sha }}"
          echo "Deployed by: ${{ github.actor }}"
          echo "Time: $(date)"
          echo "Access your app at: http://${{ secrets.VPS_HOST }}"

      # STEP 9: Rollback on failure
      - name: Rollback on failure
        if: failure()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
        run: |
          echo "⚠️  Deployment failed! Attempting rollback..."
          
          ssh -i ~/.ssh/deploy_key $VPS_USER@$VPS_HOST << 'ENDSSH'
            cd /var/www/lingua-core
          
            echo "=== Rolling back to previous commit ==="
            git reset --hard HEAD~1
          
            echo "=== Restarting containers with previous version ==="
            docker compose -f docker compose.prod.yml up -d --build
          
            echo "Rolled back to previous version"
          ENDSSH
          
          echo "DEPLOYMENT FAILED - ROLLED BACK"
          echo "Please check the logs above for errors."

# FEATURES IN THIS WORKFLOW:
# ==========================================
# ✅ Auto-create .env from GitHub Secrets
# ✅ Hardcode non-sensitive configs in workflow
# ✅ Pull latest code from Git
# ✅ Build Docker images on VPS
# ✅ Health check after deployment
# ✅ Auto-rollback on failure
# ✅ Cleanup old Docker images
# ✅ Manual trigger support (workflow_dispatch)
# ✅ Deployment summary
# ✅ Professional error handling