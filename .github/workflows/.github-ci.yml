name: Deploy to Production

# TRIGGERS
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip health check'
        required: false
        default: 'false'

# ENVIRONMENT VARIABLES
env:
  # Non-sensitive configs
  NODE_ENV: production
  TZ: Asia/Ho_Chi_Minh
  HOST: 0.0.0.0
  PAYLOAD_LIMIT: 50mb

  # Service configs
  AI_SERVICE_HOST: ai-service
  AI_SERVICE_PORT: 4001
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_PREFIX: lp
  DATABASE_HOST: postgres

  # JWT configs
  JWT_ALG: HS256
  JWT_KID: lingua-key-prod-1
  JWT_ISS: linguapanda.api
  JWT_AUD: linguapanda.web
  JWT_ACCESS_TTL: 864000
  JWT_REFRESH_TTL: 2592000
  JWT_SERVICE_TTL: 300

  # AI configs
  LLM_MODEL: gemini-2.0-flash-exp

  # Logging
  LOG_LEVEL: info

# JOBS
jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # STEP 1: CHECKOUT CODE
      - name: Checkout code
        uses: actions/checkout@v4

      # STEP 2: SETUP SSH
      - name: Setup SSH connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          
          echo "SSH key configured"

      # STEP 3: CREATE .ENV ON VPS
      - name: Create .env file on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key $VPS_USER@$VPS_HOST << 'ENDSSH'
            cat > /var/www/lingua-core/.env << 'ENVFILE'
          # Application
          NODE_ENV=${{ env.NODE_ENV }}
          TZ=${{ env.TZ }}
          HOST=${{ env.HOST }}
          PAYLOAD_LIMIT=${{ env.PAYLOAD_LIMIT }}
          
          # Database
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DATABASE_HOST=${{ env.DATABASE_HOST }}
          
          # Redis
          REDIS_HOST=${{ env.REDIS_HOST }}
          REDIS_PORT=${{ env.REDIS_PORT }}
          REDIS_DB=${{ env.REDIS_DB }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_PREFIX=${{ env.REDIS_PREFIX }}
          
          # AI Service
          AI_SERVICE_HOST=${{ env.AI_SERVICE_HOST }}
          AI_SERVICE_PORT=${{ env.AI_SERVICE_PORT }}
          
          # Google OAuth
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }}
          
          # JWT
          JWT_ALG=${{ env.JWT_ALG }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_KID=${{ env.JWT_KID }}
          JWT_ISS=${{ env.JWT_ISS }}
          JWT_AUD=${{ env.JWT_AUD }}
          JWT_ACCESS_TTL=${{ env.JWT_ACCESS_TTL }}
          JWT_REFRESH_TTL=${{ env.JWT_REFRESH_TTL }}
          JWT_SERVICE_TTL=${{ env.JWT_SERVICE_TTL }}
          
          # AI - LLM
          LLM_MODEL=${{ env.LLM_MODEL }}
          LLM_API_KEY=${{ secrets.LLM_API_KEY }}
          
          # CORS
          CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
          
          # Frontend
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          
          # Logging
          LOG_LEVEL=${{ env.LOG_LEVEL }}
          ENVFILE
          ENDSSH
          
          echo ".env file created successfully on VPS"

      # STEP 4: PULL LATEST CODE
      - name: Pull latest code on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key $VPS_USER@$VPS_HOST << 'ENDSSH'
            set -e
            cd /var/www/lingua-core
          
            echo "Fetching latest code from GitHub..."
            git fetch origin main
          
            echo "Resetting to origin/main..."
            git reset --hard origin/main
          
            COMMIT_SHA=$(git rev-parse --short HEAD)
            COMMIT_MSG=$(git log -1 --pretty=format:'%s')
          
            echo "Code updated successfully"
            echo "Current commit: $COMMIT_SHA"
            echo "Message: $COMMIT_MSG"
          ENDSSH

      # STEP 5: BACKUP CURRENT STATE (SAFETY)
      - name: Backup current containers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key $VPS_USER@$VPS_HOST << 'ENDSSH'
            cd /var/www/lingua-core
          
            # Get current running images
            docker compose -f docker-compose.prod.yml images > /tmp/pre_deploy_images.txt 2>&1 || echo "No previous deployment"
          
            echo "Backup created"
          ENDSSH

      # STEP 6: DEPLOY WITH DOCKER COMPOSE
      - name: Deploy containers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key $VPS_USER@$VPS_HOST << 'ENDSSH'
            set -e
            cd /var/www/lingua-core
          
            echo "Stopping old containers..."
            docker compose -f docker-compose.prod.yml down || true
          
            echo "Building new images (this may take 5-10 minutes)..."
            docker compose -f docker-compose.prod.yml build
          
            echo "Starting containers..."
            docker compose -f docker-compose.prod.yml up -d
          
            echo "Waiting for containers to be healthy..."
            sleep 20
          
            echo "Container status:"
            docker compose -f docker-compose.prod.yml ps
          
            echo "Deployment completed!"
          ENDSSH

      # STEP 7: HEALTH CHECK
      - name: Health check
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo " Waiting 15 seconds for services to fully start..."
          sleep 15
          
          echo "Checking API Gateway health..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://$VPS_HOST:3000/health || echo "000")
          
          if [ "$RESPONSE" = "200" ]; then
            echo "Health check PASSED! API is responding."
          elif [ "$RESPONSE" = "000" ]; then
            echo "onnection refused. Service may still be starting..."
            echo "Check logs: docker logs linguapanda_api_gateway"
          else
            echo "Health check FAILED with status: $RESPONSE"
            echo "This might be normal if /health endpoint is not yet implemented."
          fi

      # STEP 8: VERIFY LOGS
      - name: Check service logs
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key $VPS_USER@$VPS_HOST << 'ENDSSH'
            cd /var/www/lingua-core
          
            echo "Last 20 lines from api-gateway:"
            docker logs linguapanda_api_gateway --tail 20 2>&1 || echo "Container not running"
          
            echo "Last 20 lines from ai-service:"
            docker logs linguapanda_ai_service --tail 20 2>&1 || echo "Container not running"
          ENDSSH

      # STEP 9: CLEANUP OLD IMAGES
      - name: Cleanup old Docker images
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key $VPS_USER@$VPS_HOST << 'ENDSSH'
            echo "Removing unused Docker images..."
            docker image prune -f
          
            echo "Current disk usage:"
            df -h | grep -E 'Filesystem|/dev/vda'
          
            echo "Cleanup completed!"
          ENDSSH

      # STEP 10: DEPLOYMENT SUMMARY
      - name: Deployment Summary
        if: success()
        run: |
          echo "DEPLOYMENT SUCCESSFUL"
          echo "Commit: ${{ github.sha }}"
          echo "Deployed by: ${{ github.actor }}"
          echo "Time: $(date)"
          echo "Access: http://${{ secrets.VPS_HOST }}:3000"

      # STEP 11: ROLLBACK ON FAILURE
      - name: Rollback on failure
        if: failure()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
        run: |
          echo "DEPLOYMENT FAILED - ATTEMPTING ROLLBACK"
          
          ssh -i ~/.ssh/deploy_key $VPS_USER@$VPS_HOST << 'ENDSSH'
            cd /var/www/lingua-core
          
            echo "Rolling back to previous commit..."
            git reset --hard HEAD~1
          
            echo "Rebuilding with previous version..."
            docker compose -f docker-compose.prod.yml build
          
            echo "Restarting containers..."
            docker compose -f docker-compose.prod.yml up -d
          
            sleep 10
          
            echo "Container status after rollback:"
            docker compose -f docker-compose.prod.yml ps
          
            echo "Rolled back to previous version"
          ENDSSH
          
          echo "  DEPLOYMENT FAILED & ROLLED BACK"
          echo "Please check the logs above for errors"