version: '3.8'

# ===================================
# LINGUAPANDA - PRODUCTION COMPOSE
# ===================================
# Services: Postgres, Redis, API Gateway, Auth, Admin, AI, Learning
# Network: Internal bridge network for service-to-service communication

services:
  postgres:
    image: postgres:17-alpine
    container_name: linguapanda_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: linguapanda_prod
      POSTGRES_USER: linguapanda_prod
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-L1ngu4P4nd4_Pr0d_2025!}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups  # For manual backups
    ports:
      - "5432:5432"  # Expose for external tools (can be removed for security)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linguapanda_prod -d linguapanda_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - linguapanda_network
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: linguapanda_redis
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-R3d1sP4ss_Pr0d_2025!Secur3}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"  # Expose for monitoring (can be removed for security)
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - linguapanda_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # API Gateway
  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile.prod
      args:
        NODE_ENV: production
    container_name: linguapanda_api_gateway
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - linguapanda_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Auth Service
  auth-service:
    build:
      context: ./apps/auth-service
      dockerfile: Dockerfile.prod
      args:
        NODE_ENV: production
    container_name: linguapanda_auth_service
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - linguapanda_network
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  # Admin Service
  admin-service:
    build:
      context: ./apps/admin-service
      dockerfile: Dockerfile.prod
      args:
        NODE_ENV: production
    container_name: linguapanda_admin_service
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=4002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - linguapanda_network
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  # AI Service
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile.prod
      args:
        NODE_ENV: production
    container_name: linguapanda_ai_service
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=4001
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.0-flash-exp}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - linguapanda_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Learning Service
  learning-service:
    build:
      context: ./apps/learning-service
      dockerfile: Dockerfile.prod
      args:
        NODE_ENV: production
    container_name: linguapanda_learning_service
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=4003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - linguapanda_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # REVERSE PROXY - Nginx
  nginx:
    image: nginx:alpine
    container_name: linguapanda_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/out:/usr/share/nginx/html:ro  # Next.js static build
      - ./nginx/ssl:/etc/nginx/ssl:ro  # SSL certificates
      - nginx_logs:/var/log/nginx
    depends_on:
      - api-gateway
    networks:
      - linguapanda_network
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  # MONITORING - Portainer (Optional)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: linguapanda_portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - linguapanda_network
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

# NETWORKS
networks:
  linguapanda_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

# VOLUMES
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
  portainer_data:
    driver: local

# ===================================
# DEPLOYMENT COMMANDS
# Start all services:
#   docker-compose -f docker-compose.prod.yml up -d --build
#
# View logs:
#   docker-compose -f docker-compose.prod.yml logs -f [service_name]
#
# Stop all services:
#   docker-compose -f docker-compose.prod.yml down
#
# Restart a service:
#   docker-compose -f docker-compose.prod.yml restart [service_name]
#
# Check status:
#   docker-compose -f docker-compose.prod.yml ps
#
# Database backup:
#   docker exec linguapanda_postgres pg_dump -U linguapanda_prod linguapanda_prod > ./backups/backup_$(date +%Y%m%d_%H%M%S).sql
