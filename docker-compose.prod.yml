services:
  postgres:
    image: postgres:17-alpine
    container_name: linguapanda_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: linguapanda_prod
      POSTGRES_USER: linguapanda_prod
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-L1ngu4P4nd4_Pr0d_2025!}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U linguapanda_prod -d linguapanda_prod" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - linguapanda_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: linguapanda_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-R3d1sP4ss_Pr0d_2025!Secur3}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-R3d1sP4ss_Pr0d_2025!Secur3}", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - linguapanda_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
        SERVICE_PORT: 3000
    image: linguapanda-api-gateway:${IMAGE_TAG:-latest}
    container_name: linguapanda_api_gateway
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-R3d1sP4ss_Pr0d_2025!Secur3}
      - AI_SERVICE_HOST=ai-service
      - AI_SERVICE_PORT=4001
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - linguapanda_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: ai-service
        SERVICE_PORT: 4001
    image: linguapanda-ai-service:${IMAGE_TAG:-latest}
    container_name: linguapanda_ai_service
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=4001
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-R3d1sP4ss_Pr0d_2025!Secur3}
    ports:
      - "4001:4001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - linguapanda_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  linguapanda_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
